<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>rs-data-grid</title>
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div class="app-topbar">
      <button id="sidebar-toggle-btn" class="sidebar-toggle-btn" type="button" aria-label="Toggle settings menu">
        <span></span><span></span><span></span>
      </button>
      <div class="app-brand">
        <img class="app-brand-icon" src="/icon-192.png" alt="" width="24" height="24" />
        <span class="app-brand-text">Rs Grid</span>
      </div>
      <div id="app-tabs"></div>
      <div class="theme-switch-wrapper">
        <span class="theme-switch-label">Theme</span>
        <button id="theme-toggle-btn" class="theme-switch" type="button" data-theme="light" aria-label="Toggle dark/light theme">
          <span class="theme-switch-icon theme-switch-icon-moon" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
          </span>
          <span class="theme-switch-icon theme-switch-icon-sun" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
          </span>
          <span class="theme-switch-knob"></span>
        </button>
      </div>
    </div>
    <div class="app-shell">
      <div id="app-sidebar"></div>
      <div class="content-pane">
        <div id="view-mode-tabs" class="view-mode-tabs"></div>
        <div id="single-spa-application"></div>
        <div id="code-viewer" class="code-viewer"></div>
        <div id="wiki-viewer" class="wiki-viewer"></div>
      </div>
      <div id="sidebar-backdrop" class="sidebar-backdrop"></div>
    </div>
    <script type="module" src="/src/root-config.ts"></script>
  </body>
</html>
