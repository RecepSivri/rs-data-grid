<rsivri-grid
  [fetchUrl]="'http://universities.hipolabs.com/search?country=United+States'"
  [remoteMode]="false"
  [headerRowLines]="true"
  [headerColumnLines]="true"
  [showFilter]="true"
  [showSort]="true"
  [showSearch]="true"
  [exportExcel]="true"
  [exportPDF]="true"
  [bodyRowLines]="true"
  [bodyColumnLines]="true"
  [tableBorder]="true"
  [borderRadiusTop]="true"
  [borderRadiusBottom]="false"
  [diagonalRow]="true"
  [pagination]="true"
  [pagingSizes]="[10, 20, 50, 70, 100]"
  [currentPagingSize]="10"
  [pageListSize]="5"
>
  <ng-template #loadingTpl>
    <div class="demo-loading">⏳ Universities are loading…</div>
  </ng-template>
  <ng-template #errorTpl let-err>
    <div class="demo-error">Failed to load universities: {{ err?.message }}</div>
  </ng-template>
</rsivri-grid>
