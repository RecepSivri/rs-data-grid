@if (pagination) {
  <div class="full-row row-layout-space-between-center pager-row">
    <div class="row-layout-start page-number-background">
      <div class="page-numbers" (click)="decreasePager()"><</div>
      @for (page of pageList(); track page) {
        <div
          [class.page-numbers-selected]="pageNumber() === page - 1"
          class="page-numbers"
          (click)="setpage(page - 1)">
          {{ page }}
        </div>
      }
      @if (writeAS(pageList()?.[0], pageListSize, pageLimit())) {
        <div class="page-numbers" (click)="lastPage()">
          {{ pageLimit() }}
        </div>
      }
      <div class="page-numbers" (click)="increasePager()">></div>
    </div>
    <div class="row-layout">
      @for (item of pagingSizes; track item) {
        <a
          class="pager-size"
          (click)="changeCurrentPaginationSize(item)"
          [class.page-selected]="item === pageSize()">
          {{ item }}
        </a>
      }
    </div>
  </div>
}
