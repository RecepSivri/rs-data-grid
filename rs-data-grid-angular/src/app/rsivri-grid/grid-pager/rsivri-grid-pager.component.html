@if (pagination) {
  <div class="full-row row-layout-space-between-center">
    <div class="row-layout-start page-number-background">
      <div class="page-numbers" (click)="decreasePager()"><</div>
      @for (page of pageList$ | async; track page) {
        <div
          [class.page-numbers-selected]="(pageNumber$ | async) === page - 1"
          class="page-numbers"
          (click)="setpage(page - 1)">
          {{ page }}
        </div>
      }
      @if (writeAS((pageList$ | async)?.[0], pageListSize, (pageLimit$ | async))) {
        <div class="page-numbers" (click)="lastPage()">
          {{ pageLimit$ | async }}
        </div>
      }
      <div class="page-numbers" (click)="increasePager()">></div>
    </div>
    <div class="row-layout">
      @for (item of pagingSizes; track item) {
        <a
          class="pager-size"
          (click)="changeCurrentPaginationSize(item)"
          [class.page-selected]="item === (pageSize$ | async)">
          {{ item }}
        </a>
      }
    </div>
  </div>
}
