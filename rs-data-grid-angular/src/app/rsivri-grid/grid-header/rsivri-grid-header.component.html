<div class="full-row row-layout-space-between-center border-area-small'"
  [class.border-header]="tableBorder"
  [class.border-area-small]="borderRadiusTop">
  @for (column of columns; track column.dataField; let i = $index) {
    <div class="full-row content-style row-layout-center-center"
      [class.border-right]="headerColumnLines && i < columns.length - 1">
      {{ column.caption | titlecase }}
    </div>
  }
</div>
