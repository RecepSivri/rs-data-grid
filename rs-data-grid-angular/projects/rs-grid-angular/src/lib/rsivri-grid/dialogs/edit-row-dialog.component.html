<h2 mat-dialog-title>{{ data.row ? 'Edit row' : 'Add row' }}</h2>
<mat-dialog-content>
  <div class="edit-form">
    @for (field of fields; track field.key) {
      <div class="edit-row">
        <label class="edit-label">{{ field.key }}</label>
        <input type="text" class="edit-input" [(ngModel)]="editableRow[field.key]" />
      </div>
    }
  </div>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button type="button" (click)="onCancel()">Cancel</button>
  <button mat-raised-button color="primary" type="button" (click)="onSave()">Save</button>
</mat-dialog-actions>
