[build]
  command = "./build-all.sh"
  publish = "rs-data-grid-root-config/dist"

[build.environment]
  NODE_VERSION = "22"

# The demo grid's default data source (universities.hipolabs.com) only
# serves plain HTTP, which every browser blocks as mixed content when
# called from this HTTPS site. Proxying it through the same origin keeps
# the browser's connection on HTTPS throughout -- Netlify's edge fetches
# the HTTP backend server-side, where mixed-content rules don't apply.
# Must come before the catch-all "/*" redirect below (first match wins).
[[redirects]]
  from = "/api/universities/*"
  to = "http://universities.hipolabs.com/:splat"
  status = 200
  force = true

# Routing between frameworks is done client-side via location.hash
# (#/react, #/angular, ...), which never reaches the server, so this isn't
# needed for the tab switcher itself. It's kept as a standard SPA fallback:
# any request path with no matching file in the published folder (e.g. a
# stray deep link) still resolves to the shell instead of Netlify's 404 page.
# Real files -- including everything under /mfe/<name>/ -- are always served
# as themselves first; this only applies when nothing on disk matches.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
