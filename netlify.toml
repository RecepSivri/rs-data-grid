[build]
  command = "./build-all.sh"
  publish = "rs-data-grid-root-config/dist"

[build.environment]
  NODE_VERSION = "22"

# Generic HTTP proxy: any plain-http:// fetchUrl the grid is configured
# with (the demo default, or a custom one typed into the sidebar) gets
# blocked as mixed content when called directly from this HTTPS site.
# Each app rewrites such URLs to /api/http-proxy/<host>/<path...> before
# fetching (see toSameOriginIfInsecure in each store); Netlify's edge then
# fetches the real http:// target server-side, where mixed-content rules
# don't apply, and returns it over the browser's original HTTPS connection.
# Must come before the catch-all "/*" redirect below (first match wins).
# Note: this makes the site proxy arbitrary http:// URLs on request -- an
# accepted tradeoff so any user-typed fetchUrl works, not just the demo one.
[[redirects]]
  from = "/api/http-proxy/*"
  to = "http://:splat"
  status = 200
  force = true

# Routing between frameworks is done client-side via location.hash
# (#/react, #/angular, ...), which never reaches the server, so this isn't
# needed for the tab switcher itself. It's kept as a standard SPA fallback:
# any request path with no matching file in the published folder (e.g. a
# stray deep link) still resolves to the shell instead of Netlify's 404 page.
# Real files -- including everything under /mfe/<name>/ -- are always served
# as themselves first; this only applies when nothing on disk matches.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
